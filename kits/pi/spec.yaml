schemaVersion: "2"
kind: sandbox
name: pi
version: "0.1.0"
displayName: Pi
description: The pi coding agent, from pi.dev
sourceURL: https://github.com/valeriy-maslov/sbx-environments
licenses:
  - MIT

sandbox:
  # shell-docker ships Node 22.22.1; pi's installer needs 22.19.0 or newer and
  # aborts without a TTY when it has to install Node itself
  image: "docker/sandbox-templates:shell-docker"
  entrypoint: [pi]

permissions:
  network:
    allow:
      # the installer and its release metadata endpoint
      - "pi.dev:443"
      # install.sh installs the agent from npm
      - "registry.npmjs.org:443"
      # openrouter, for both /login and the api itself
      - "openrouter.ai:443"

setup:
  install:
    - command: "curl -fsSL https://pi.dev/install.sh | sh"
      user: "1000"
      description: Install the pi coding agent

agentInstructions:
  filename: AGENTS.md
  content: |
    ## Sandbox environment

    You are running inside a Docker sandbox. Outbound network access is denied
    by default and only the hosts declared by this kit are reachable, so a
    failing download is usually a policy decision rather than a broken mirror.

    The workspace is mounted from the host. Treat everything outside it as
    scratch space that disappears with the sandbox.
