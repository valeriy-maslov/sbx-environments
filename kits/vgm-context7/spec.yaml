schemaVersion: "2"
kind: mixin
name: vgm-context7
version: "0.1.0"
displayName: Context7
description: Up-to-date library docs via the Context7 CLI, MCP server and skill
sourceURL: https://github.com/valeriy-maslov/sbx-environments
licenses:
  - MIT

permissions:
  network:
    allow:
      - "registry.npmjs.org:443"
      - "context7.com:443"
      - "mcp.context7.com:443"
      - "api.context7.com:443"

setup:
  install:
    - command: "npm install -g ctx7@latest"
      user: "1000"
      description: Install the Context7 CLI

    # CONTEXT7_API_KEY is not declared here; set it up on the host with
    # sbx secret set-custom (see the README) before creating the sandbox.
    - command: |
        if [ -n "${CONTEXT7_API_KEY:-}" ]; then
          ctx7 setup --claude --api-key "$CONTEXT7_API_KEY"
        else
          echo "vgm-context7: CONTEXT7_API_KEY is not set, skipping ctx7 setup." >&2
          echo "vgm-context7: run 'ctx7 setup --claude --api-key YOUR_KEY' by hand once you have one." >&2
        fi
      user: "1000"
      description: Register the Context7 MCP server and skill for Claude Code
